services:
  - type: web
    name: telegram-auto-video-editor
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      - key: MAX_UPLOAD_MB
        value: "20"
      - key: MAX_MEDIA_FILES
        value: "20"
